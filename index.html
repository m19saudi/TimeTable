<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TimeTable</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23000'%3E%3Cpath d='M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z'/%3E%3Cpath d='M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z'/%3E%3C/svg%3E"
>

    <style>

        :root {
            --bg-color: #090b11;
            --card-empty: #161923;
            --card-blue: #0091ff;
            --card-pink: #d02b9e;
            --card-green: #00bfa5;
            --card-orange: #f57c00;
            --card-purple: #8a2be2;
            --card-teal: #00afcb;
            --card-crimson: #e0115f;
            --card-gold: #d4af37;
            --card-lavender: #b19ffb;
            --text-main: #ffffff;
            --text-muted: #62697e;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--text-main);

            margin: 0;
            padding: 20px 60px;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;

            box-sizing: border-box;
            overflow-x: hidden;
        }


        /* =========================
           HEADER
           ========================= */

        .header-container {
            width: 100%;
            max-width: 1300px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .logo span {
            font-weight: 300;
            color: #a0a5b5;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .view-toggle-btn {
            background: none;
            border: 1px solid #232838;
            color: var(--text-muted);

            padding: 8px 16px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: 500;
            font-size: 0.85rem;

            transition: all 0.2s;

            white-space: nowrap;
        }

        .view-toggle-btn.active {
            background-color: #161923;
            color: var(--text-main);
            border-color: #3b4257;
        }

        .io-btn {
            background-color: #161923;
            border: 1px solid #3b4257;
            color: var(--text-main);

            padding: 8px 14px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: 500;
            font-size: 0.85rem;

            transition: all 0.2s;

            display: flex;
            align-items: center;
            gap: 6px;

            white-space: nowrap;
        }

        .io-btn:hover {
            background-color: #232838;
            border-color: var(--card-blue);
        }

        .badge {
            background-color: rgba(0, 191, 165, 0.1);
            color: #00bfa5;

            padding: 8px 18px;

            border-radius: 20px;

            font-size: 0.85rem;
            font-weight: 500;

            display: flex;
            align-items: center;
            gap: 8px;

            border: 1px solid rgba(0, 191, 165, 0.2);

            white-space: nowrap;
        }

        .badge::before {
            content: "●";
            font-size: 0.7rem;
        }


        /* =========================
           MAIN VIEW
           ========================= */

        .view-section {
            width: 100%;
            max-width: 1300px;
        }

        #entryView {
            display: none;
        }


        /* =========================
           TIMETABLE GRID
           ========================= */

        .timetable-grid {
            display: grid;

            grid-template-columns:
                100px repeat(
                    5,
                    minmax(160px, 1fr)
                );

            row-gap: 12px;
            column-gap: 24px;

            width: 100%;
        }

        .time-header {
            color: var(--text-muted);

            font-size: 0.9rem;
            font-weight: 500;

            text-align: center;

            padding-bottom: 5px;

            white-space: nowrap;
        }

        .day-header {
            color: #a0a5b5;

            font-weight: 600;
            font-size: 1.05rem;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            height: 120px;
        }


        /* =========================
           TIMETABLE CARDS
           ========================= */

        .slot-card {
            background-color: var(--card-empty);

            height: 120px;

            border-radius: 12px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 15px;

            box-sizing: border-box;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background-color 0.2s;

            user-select: none;

            position: relative;

            min-width: 0;

            overflow: hidden;
        }

        .slot-card:hover {
            transform: scale(1.02);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.3);
        }

        .slot-card.dragging {
            opacity: 0.3;

            border:
                2px dashed #ffffff;
        }

        .slot-card.drag-over {
            background-color: #202536;

            box-shadow:
                0 0 15px
                rgba(0, 145, 255, 0.2);
        }

        .slot-card .dash {
            color: #383f52;

            font-size: 1.4rem;
            font-weight: 400;
        }

        .slot-card .subject {
            font-weight: 700;

            font-size: 1.05rem;

            margin-bottom: 5px;

            letter-spacing: -0.2px;

            max-width: 100%;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .slot-card .meta {
            font-size: 0.8rem;

            opacity: 0.8;

            margin-top: 2px;

            max-width: 100%;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .slot-card .link-hint {
            position: absolute;

            bottom: 6px;
            right: 8px;

            font-size: 0.75rem;

            opacity: 0.6;
        }

        .slot-card:hover .link-hint {
            opacity: 1;
            transform: scale(1.1);
        }


        /* =========================
           CARD COLORS
           ========================= */

        .slot-card.blue {
            background-color: var(--card-blue);
            color: white;
        }

        .slot-card.pink {
            background-color: var(--card-pink);
            color: white;
        }

        .slot-card.green {
            background-color: var(--card-green);
            color: white;
        }

        .slot-card.orange {
            background-color: var(--card-orange);
            color: white;
        }

        .slot-card.purple {
            background-color: var(--card-purple);
            color: white;
        }

        .slot-card.teal {
            background-color: var(--card-teal);
            color: white;
        }

        .slot-card.crimson {
            background-color: var(--card-crimson);
            color: white;
        }

        .slot-card.gold {
            background-color: var(--card-gold);
            color: #090b11;
        }

        .slot-card.lavender {
            background-color: var(--card-lavender);
            color: #090b11;
        }


        /* =========================
           ENTRY VIEW
           ========================= */

        .entry-container {
            display: grid;

            grid-template-columns:
                1fr 2fr;

            gap: 40px;

            background-color: #11141d;

            padding: 40px;

            border-radius: 16px;

            border:
                1px solid #1f2433;
        }

        .entry-form h3 {
            margin-top: 0;
            margin-bottom: 20px;

            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-size: 0.8rem;

            color: var(--text-muted);

            margin-bottom: 6px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px;

            background-color: var(--bg-color);

            border:
                1px solid #232838;

            border-radius: 8px;

            color: white;

            box-sizing: border-box;

            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;

            border-color:
                var(--card-blue);
        }

        .form-actions {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;

            border-radius: 8px;

            border: none;

            cursor: pointer;

            font-weight: 600;

            font-size: 0.95rem;

            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.88;
        }

        .btn-primary {
            background-color:
                var(--card-blue);

            color: white;

            width: 100%;
        }

        .btn-secondary {
            background-color: #232838;
            color: white;
        }

        .btn-danger {
            background-color: #d32f2f;
            color: white;
        }

        .entry-list-view {
            border-left:
                1px solid #232838;

            padding-left: 40px;

            max-height: 500px;

            overflow-y: auto;
        }

        .list-item-row {
            background-color:
                var(--bg-color);

            padding: 15px 20px;

            border-radius: 10px;

            margin-bottom: 12px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            border-left:
                4px solid
                var(--card-blue);
        }

        .list-item-row.pink {
            border-left-color:
                var(--card-pink);
        }

        .list-item-row.green {
            border-left-color:
                var(--card-green);
        }

        .list-item-row.orange {
            border-left-color:
                var(--card-orange);
        }

        .list-item-row.purple {
            border-left-color:
                var(--card-purple);
        }

        .list-item-row.teal {
            border-left-color:
                var(--card-teal);
        }

        .list-item-row.crimson {
            border-left-color:
                var(--card-crimson);
        }

        .list-item-row.gold {
            border-left-color:
                var(--card-gold);
        }

        .list-item-row.lavender {
            border-left-color:
                var(--card-lavender);
        }

        .list-item-info span {
            color: var(--text-muted);

            font-size: 0.85rem;

            margin-right: 10px;
        }


        /* =========================
           MODAL
           ========================= */

        .modal {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color:
                rgba(0,0,0,0.7);

            backdrop-filter:
                blur(4px);

            justify-content: center;
            align-items: center;

            z-index: 100;

            padding: 20px;
        }

        .modal-content {
            background-color:
                #11141d;

            padding: 30px;

            border-radius: 16px;

            width: 340px;

            max-width: 100%;

            border:
                1px solid #232838;

            box-shadow:
                0 20px 40px
                rgba(0,0,0,0.5);
        }


        /* =========================
           TABLET LANDSCAPE
           ========================= */

        @media
        (min-width: 851px)
        and
        (max-width: 1100px) {

            body {
                padding: 16px 24px;
            }

            .header-container {
                max-width: 100%;
                margin-bottom: 16px;
            }

            .header-right {
                gap: 7px;
            }

            .io-btn,
            .view-toggle-btn {
                padding: 7px 10px;
                font-size: 0.75rem;
            }

            .badge {
                padding: 7px 12px;
                font-size: 0.75rem;
            }

            .timetable-grid {
                grid-template-columns:
                    55px repeat(
                        5,
                        minmax(0, 1fr)
                    );

                column-gap: 9px;
                row-gap: 9px;
            }

            .time-header {
                font-size: 0.72rem;
                padding-bottom: 0;
            }

            .day-header {
                height: 100px;
                font-size: 0.88rem;
            }

            .slot-card {
                height: 100px;
                padding: 8px;
                border-radius: 10px;
            }

            .slot-card .subject {
                font-size: 0.86rem;
            }

            .slot-card .meta {
                font-size: 0.68rem;
            }

            .slot-card .dash {
                font-size: 1.1rem;
            }

            .entry-container {
                gap: 25px;
                padding: 25px;
            }

            .entry-list-view {
                padding-left: 25px;
            }
        }


        /* =========================
           TABLET PORTRAIT
           ========================= */

        @media
        (min-width: 600px)
        and
        (max-width: 850px) {

            body {
                padding: 12px 12px;
            }

            .header-container {
                width: 100%;

                margin-bottom: 14px;

                flex-wrap: wrap;

                gap: 10px;
            }

            .logo {
                font-size: 1.5rem;
            }

            .header-right {
                width: 100%;

                justify-content: flex-end;

                flex-wrap: wrap;

                gap: 6px;
            }

            .io-btn,
            .view-toggle-btn {
                padding: 7px 9px;
                font-size: 0.72rem;
            }

            .timetable-grid {
                grid-template-columns:
                    48px repeat(
                        5,
                        minmax(0, 1fr)
                    );

                column-gap: 6px;

                row-gap: 8px;

                width: 100%;
            }

            .time-header {
                font-size: 0.62rem;

                padding-bottom: 0;

                letter-spacing: -0.2px;
            }

            .day-header {
                height: 90px;
                font-size: 0.78rem;
            }

            .slot-card {
                height: 90px;

                padding: 6px;

                border-radius: 9px;
            }

            .slot-card .subject {
                font-size: 0.76rem;

                margin-bottom: 3px;
            }

            .slot-card .meta {
                font-size: 0.62rem;

                margin-top: 1px;
            }

            .slot-card .dash {
                font-size: 1rem;
            }

            .slot-card .link-hint {
                bottom: 4px;
                right: 5px;

                font-size: 0.6rem;
            }

            .badge {
                display: none;
            }

            .entry-container {
                grid-template-columns: 1fr;

                gap: 25px;

                padding: 22px;
            }

            .entry-list-view {
                border-left: none;

                border-top:
                    1px solid #232838;

                padding-left: 0;

                padding-top: 25px;

                max-height: none;
            }
        }


        /* =========================
           VERY SMALL TABLETS
           ========================= */

        @media
        (min-width: 600px)
        and
        (max-width: 700px) {

            .logo {
                font-size: 1.35rem;
            }

            .header-right {
                justify-content: flex-start;
            }

            .timetable-grid {
                grid-template-columns:
                    42px repeat(
                        5,
                        minmax(0, 1fr)
                    );

                column-gap: 5px;

                row-gap: 7px;
            }

            .time-header {
                font-size: 0.55rem;
            }

            .day-header {
                height: 82px;
                font-size: 0.72rem;
            }

            .slot-card {
                height: 82px;

                padding: 4px;

                border-radius: 8px;
            }

            .slot-card .subject {
                font-size: 0.68rem;
            }

            .slot-card .meta {
                font-size: 0.56rem;
            }
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 599px) {

            body {
                padding: 12px 8px;
            }

            .header-container {
                flex-direction: column;

                align-items: stretch;

                gap: 10px;

                margin-bottom: 12px;
            }

            .logo {
                text-align: center;

                font-size: 1.5rem;
            }

            .header-right {
                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 6px;
            }

            .io-btn,
            .view-toggle-btn {
                width: 100%;

                justify-content: center;

                padding: 8px 5px;

                font-size: 0.7rem;
            }

            .badge {
                display: none;
            }

            .timetable-grid {
                grid-template-columns:
                    36px repeat(
                        5,
                        minmax(0, 1fr)
                    );

                column-gap: 4px;

                row-gap: 6px;
            }

            .time-header {
                font-size: 0.46rem;

                padding-bottom: 0;

                white-space: normal;

                line-height: 1.1;
            }

            .day-header {
                height: 72px;

                font-size: 0.65rem;
            }

            .slot-card {
                height: 72px;

                padding: 3px;

                border-radius: 7px;
            }

            .slot-card .subject {
                font-size: 0.58rem;

                margin-bottom: 2px;
            }

            .slot-card .meta {
                font-size: 0.48rem;
            }

            .slot-card .dash {
                font-size: 0.85rem;
            }

            .slot-card .link-hint {
                display: none;
            }

            .entry-container {
                grid-template-columns: 1fr;

                gap: 20px;

                padding: 16px;
            }

            .entry-list-view {
                border-left: none;

                border-top:
                    1px solid #232838;

                padding-left: 0;

                padding-top: 20px;

                max-height: none;
            }

            .form-actions {
                flex-wrap: wrap;
            }

            .btn {
                padding: 10px 16px;
            }

            .modal-content {
                padding: 22px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HEADER
         ========================= -->

    <div class="header-container">

        <div class="logo">
            Time<span>Table</span>
        </div>

        <div class="header-right">

            <!-- JSON EXPORT -->
            <button
                class="io-btn"
                onclick="exportData()"
            >
                📥 Export
            </button>


            <!-- JSON IMPORT -->
            <button
                class="io-btn"
                onclick="
                    document
                        .getElementById('importFile')
                        .click()
                "
            >
                📤 Import
            </button>

            <input
                type="file"
                id="importFile"
                style="display:none;"
                accept=".json"
                onchange="importData(event)"
            >


            <!-- GRID VIEW -->
            <button
                id="toggleGridBtn"
                class="view-toggle-btn active"
                onclick="switchView('grid')"
            >
                Grid View
            </button>


            <!-- FORM VIEW -->
            <button
                id="toggleEntryBtn"
                class="view-toggle-btn"
                onclick="switchView('entry')"
            >
                Form Entry View
            </button>


            <div class="badge">
                Interactive Mode
            </div>

        </div>

    </div>


    <!-- =========================
         GRID VIEW
         ========================= -->

    <div
        id="gridView"
        class="view-section"
    >

        <div
            class="timetable-grid"
            id="mainTimetableGrid"
        >
            <!-- Rendered dynamically -->
        </div>

    </div>


    <!-- =========================
         FORM ENTRY VIEW
         ========================= -->

    <div
        id="entryView"
        class="view-section"
    >

        <div class="entry-container">


            <!-- FORM -->

            <div class="entry-form">

                <h3>
                    Add / Manage Entry
                </h3>


                <div class="form-group">

                    <label for="formDay">
                        Day
                    </label>

                    <select id="formDay">

                        <option value="Sun">
                            Sunday
                        </option>

                        <option value="Mon">
                            Monday
                        </option>

                        <option value="Tue">
                            Tuesday
                        </option>

                        <option value="Wed">
                            Wednesday
                        </option>

                        <option value="Thu">
                            Thursday
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="formTime">
                        Time Slot
                    </label>

                    <select id="formTime">

                        <option value="0">
                            10:00 - 12:00
                        </option>

                        <option value="1">
                            12:00 - 14:00
                        </option>

                        <option value="2">
                            14:00 - 16:00
                        </option>

                        <option value="3">
                            16:00 - 18:00
                        </option>

                        <option value="4">
                            18:00 - 20:00
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="formSubject">
                        Subject Name
                    </label>

                    <input
                        type="text"
                        id="formSubject"
                        placeholder="e.g., Computer Science"
                    >

                </div>


                <div class="form-group">

                    <label for="formRoom">
                        Room / Modality
                    </label>

                    <input
                        type="text"
                        id="formRoom"
                        placeholder="e.g., online, Room 153"
                    >

                </div>


                <div class="form-group">

                    <label for="formInstructor">
                        Instructor / Extra
                    </label>

                    <input
                        type="text"
                        id="formInstructor"
                        placeholder="e.g., Dr. Smith"
                    >

                </div>


                <div class="form-group">

                    <label for="formLink">
                        Class Join Link (URL)
                    </label>

                    <input
                        type="url"
                        id="formLink"
                        placeholder="https://zoom.us/j/..."
                    >

                </div>


                <div class="form-group">

                    <label for="formColor">
                        Color Accent
                    </label>

                    <select id="formColor">

                        <option value="blue">
                            Blue
                        </option>

                        <option value="pink">
                            Pink
                        </option>

                        <option value="green">
                            Green
                        </option>

                        <option value="orange">
                            Orange
                        </option>

                        <option value="purple">
                            Purple
                        </option>

                        <option value="teal">
                            Teal
                        </option>

                        <option value="crimson">
                            Crimson
                        </option>

                        <option value="gold">
                            Gold
                        </option>

                        <option value="lavender">
                            Lavender
                        </option>

                    </select>

                </div>


                <!-- SAVE / WIPE -->

                <div
                    class="form-actions"
                    style="
                        margin-top:25px;
                        flex-wrap:wrap;
                    "
                >

                    <button
                        class="btn btn-primary"
                        onclick="handleFormSubmit()"
                        style="
                            width:auto;
                            flex:1;
                        "
                    >
                        Save to Timetable
                    </button>


                    <button
                        class="btn btn-danger"
                        onclick="wipeAll()"
                        style="width:auto;"
                    >
                        Wipe All
                    </button>

                </div>


                <!-- MASTER CONTROLS -->

                <div
                    class="form-actions"
                    style="

    <!-- =========================

    <div

    <!-- =========================================================
         MASTER TIMETABLE
         =========================================================

         timetable.js must be in the SAME folder as this HTML.

         Example:

         index.html
         timetable.js

         timetable.js should contain:

         const MASTER_TIMETABLE = {
             "Sun-0": {
                 subject: "Computer Science",
                 room: "Room 153",
                 instructor: "Dr. Smith",
                 link: "",
                 color: "blue"
             }
         };

    ========================================================== -->

    <script src="./timetable.js"></script>


    <!-- =========================
         APPLICATION JAVASCRIPT
         ========================= -->

    <script>

        const days = [
            'Sun',
            'Mon',
            'Tue',
            'Wed',
            'Thu'
        ];


        const times = [
            '10:00 - 12:00',
            '12:00 - 14:00',
            '14:00 - 16:00',
            '16:00 - 18:00',
            '18:00 - 20:00'
        ];


        /*
         * Copy the master timetable into memory.
         *
         * This is only the starting/master version.
         * User changes are stored separately in localStorage.
         */

        let masterTimetableData =
            JSON.parse(
                JSON.stringify(
                    window.MASTER_TIMETABLE || {}
                )
            );


        /*
         * Load user's local timetable if one exists.
         *
         * If this is the user's first visit,
         * copy the master timetable into localStorage.
         */

        let timetableData;


        const savedTimetable =
            localStorage.getItem(
                'perfect_timetable_db'
            );


        if (savedTimetable) {

            try {

                timetableData =
                    JSON.parse(
                        savedTimetable
                    );

            } catch (error) {

                timetableData =
                    JSON.parse(
                        JSON.stringify(
                            masterTimetableData
                        )
                    );

                localStorage.setItem(
                    'perfect_timetable_db',
                    JSON.stringify(
                        timetableData
                    )
                );
            }

        } else {

            timetableData =
                JSON.parse(
                    JSON.stringify(
                        masterTimetableData
                    )
                );

            localStorage.setItem(
                'perfect_timetable_db',
                JSON.stringify(
                    timetableData
                )
            );
        }


        let activeEditKey = null;

        let activeDraggedKey = null;


        /* =========================
           INITIALIZE
           ========================= */

        function init() {

            renderGridStructure();

            renderFormLists();
        }


        /* =========================
           SAVE LOCAL DATA
           ========================= */

        function persist() {

            localStorage.setItem(
                'perfect_timetable_db',
                JSON.stringify(
                    timetableData
                )
            );
        }


        /* =========================
           JSON EXPORT
           ========================= */

        function exportData() {

            const dataStr =
                "data:text/json;charset=utf-8," +
                encodeURIComponent(
                    JSON.stringify(
                        timetableData,
                        null,
                        2
                    )
                );


            const downloadAnchor =
                document.createElement('a');


            downloadAnchor.setAttribute(
                "href",
                dataStr
            );


            downloadAnchor.setAttribute(
                "download",
                "timetable_backup.json"
            );


            document.body.appendChild(
                downloadAnchor
            );


            downloadAnchor.click();


            downloadAnchor.remove();
        }


        /* =========================
           JSON IMPORT
           ========================= */

        function importData(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            const fileReader =
                new FileReader();


            fileReader.onload =
                function(e) {

                    try {

                        const parsedData =
                            JSON.parse(
                                e.target.result
                            );


                        if (
                            parsedData &&
                            typeof parsedData === 'object' &&
                            !Array.isArray(parsedData)
                        ) {

                            timetableData =
                                parsedData;


                            persist();


                            renderGridStructure();

                            renderFormLists();


                            alert(
                                'Timetable successfully imported!'
                            );

                        } else {

                            alert(
                                'Invalid timetable file structure.'
                            );
                        }


                    } catch (err) {

                        alert(
                            'Error loading file. Please upload a valid JSON file.'
                        );
                    }

                };


            fileReader.readAsText(file);


            /*
             * Allows the same file to be selected again later.
             */

            event.target.value = '';
        }


        /* =========================
           VIEW SWITCH
           ========================= */

        function switchView(viewName) {

            if (viewName === 'grid') {

                document.getElementById(
                    'gridView'
                ).style.display = 'block';


                document.getElementById(
                    'entryView'
                ).style.display = 'none';


                document.getElementById(
                    'toggleGridBtn'
                ).classList.add('active');


                document.getElementById(
                    'toggleEntryBtn'
                ).classList.remove('active');


                renderGridStructure();

            } else {

                document.getElementById(
                    'gridView'
                ).style.display = 'none';


                document.getElementById(
                    'entryView'
                ).style.display = 'block';


                document.getElementById(
                    'toggleGridBtn'
                ).classList.remove('active');


                document.getElementById(
                    'toggleEntryBtn'
                ).classList.add('active');


                renderFormLists();
            }
        }


        /* =========================
           GRID RENDER
           ========================= */

        function renderGridStructure() {

            const grid =
                document.getElementById(
                    'mainTimetableGrid'
                );


            grid.innerHTML = '';


            /*
             * Header spacer
             */

            const spacer =
                document.createElement(
                    'div'
                );


            spacer.className =
                'time-header-spacer';


            grid.appendChild(spacer);


            /*
             * Time headers
             */

            times.forEach(time => {

                const header =
                    document.createElement(
                        'div'
                    );


                header.className =
                    'time-header';


                header.textContent =
                    time;


                grid.appendChild(header);
            });


            /*
             * Days
             */

            days.forEach(day => {

                const dayLabel =
                    document.createElement(
                        'div'
                    );


                dayLabel.className =
                    'day-header';


                dayLabel.textContent =
                    day;


                grid.appendChild(
                    dayLabel
                );


                /*
                 * Five time slots
                 */

                for (
                    let i = 0;
                    i < 5;
                    i++
                ) {

                    const slotKey =
                        `${day}-${i}`;


                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'slot-card';


                    card.setAttribute(
                        'data-key',
                        slotKey
                    );


                    /*
                     * Existing class
                     */

                    if (
                        timetableData[
                            slotKey
                        ]
                    ) {

                        const data =
                            timetableData[
                                slotKey
                            ];


                        card.classList.add(
                            data.color || 'blue'
                        );


                        card.draggable = true;


                        const hasLink =
                            data.link &&
                            data.link.trim() !== "";


                        const linkIcon =
                            hasLink
                                ? ' 🔗'
                                : '';


                        /*
                         * textContent is safer than
                         * inserting user content
                         * directly as HTML.
                         */

                        const subject =
                            document.createElement(
                                'div'
                            );

                        subject.className =
                            'subject';

                        subject.textContent =
                            data.subject || '';


                        const room =
                            document.createElement(
                                'div'
                            );

                        room.className =
                            'meta';

                        room.textContent =
                            (data.room || '') +
                            linkIcon;


                        const instructor =
                            document.createElement(
                                'div'
                            );

                        instructor.className =
                            'meta';

                        instructor.textContent =
                            data.instructor || '';


                        card.appendChild(
                            subject
                        );

                        card.appendChild(
                            room
                        );

                        card.appendChild(
                            instructor
                        );


                        /*
                         * Left click:
                         *
                         * If a link exists,
                         * open the link.
                         *
                         * Otherwise edit.
                         */

                        card.addEventListener(
                            'click',
                            () => {

                                if (hasLink) {

                                    window.open(
                                        data.link.trim(),
                                        '_blank'
                                    );

                                } else {

                                    triggerQuickEdit(
                                        slotKey
                                    );
                                }

                            }
                        );


                        /*
                         * Right click always edits.
                         */

                        card.addEventListener(
                            'contextmenu',
                            (e) => {

                                e.preventDefault();

                                triggerQuickEdit(
                                    slotKey
                                );
                            }
                        );


                    } else {

                        /*
                         * Empty card
                         */

                        card.innerHTML =
                            '<div class="dash">-</div>';


                        card.addEventListener(
                            'click',
                            () =>
                                triggerQuickEdit(
                                    slotKey
                                )
                        );
                    }


                    /*
                     * Drag and drop
                     */

                    card.addEventListener(
                        'dragstart',
                        handleDragStart
                    );


                    card.addEventListener(
                        'dragover',
                        handleDragOver
                    );


                    card.addEventListener(
                        'dragleave',
                        handleDragLeave
                    );


                    card.addEventListener(
                        'drop',
                        handleDrop
                    );


                    card.addEventListener(
                        'dragend',
                        handleDragEnd
                    );


                    grid.appendChild(
                        card
                    );
                }

            });

        }


        /* =========================
           FORM LIST
           ========================= */

        function renderFormLists() {

            const listContainer =
                document.getElementById(
                    'liveStatusList'
                );


            listContainer.innerHTML = '';


            let count = 0;


            days.forEach(day => {

                for (
                    let i = 0;
                    i < 5;
                    i++
                ) {

                    const key =
                        `${day}-${i}`;


                    if (
                        timetableData[key]
                    ) {

                        count++;


                        const data =
                            timetableData[key];


                        const item =
                            document.createElement(
                                'div'
                            );


                        item.className =
                            `list-item-row ${data.color || 'blue'}`;


                        const info =
                            document.createElement(
                                'div'
                            );


                        info.className =
                            'list-item-info';


                        const schedule =
                            document.createElement(
                                'span'
                            );


                        schedule.textContent =
                            `[${day} ${times[i]}]`;


                        const subject =
                            document.createElement(
                                'strong'
                            );


                        subject.textContent =
                            data.subject || '';


                        const details =
                            document.createElement(
                                'div'
                            );


                        details.style.cssText =
                            `
                            font-size:0.8rem;
                            opacity:0.7;
                            margin-top:2px;
                            `;


                        details.textContent =
                            (data.room || '') +
                            (
                                data.instructor
                                    ? ' • ' +
                                      data.instructor
                                    : ''
                            );


                        info.appendChild(
                            schedule
                        );

                        info.appendChild(
                            subject
                        );

                        info.appendChild(
                            details
                        );


                        if (
                            data.link &&
                            data.link.trim()
                        ) {

                            const linkDisplay =
                                document.createElement(
                                    'div'
                                );


                            linkDisplay.style.cssText =
                                `
                                font-size:0.75rem;
                                color:#0091ff;
                                overflow:hidden;
                                text-overflow:ellipsis;
                                white-space:nowrap;
                                max-width:300px;
                                `;


                            linkDisplay.textContent =
                                '🔗 ' +
                                data.link;


                            info.appendChild(
                                linkDisplay
                            );
                        }


                        const editButton =
                            document.createElement(
                                'button'
                            );


                        editButton.className =
                            'view-toggle-btn active';


                        editButton.textContent =
                            'Edit';


                        editButton.onclick =
                            function() {

                                triggerQuickEdit(
                                    key
                                );

                            };


                        item.appendChild(
                            info
                        );


                        item.appendChild(
                            editButton
                        );


                        listContainer.appendChild(
                            item
                        );
                    }
                }

            });


            if (count === 0) {

                listContainer.innerHTML = `
                    <div style="
                        color:var(--text-muted);
                        font-size:0.9rem;
                    ">
                        No entries saved yet.
                        Fill out the form fields on the left
                        to add your items.
                    </div>
                `;
            }
        }


        /* =========================
           FORM SUBMIT
           ========================= */

        function handleFormSubmit() {

            const day =
                document.getElementById(
                    'formDay'
                ).value;


            const timeIndex =
                document.getElementById(
                    'formTime'
                ).value;


            const subject =
                document.getElementById(
                    'formSubject'
                ).value.trim();


            const room =
                document.getElementById(
                    'formRoom'
                ).value.trim();


            const instructor =
                document.getElementById(
                    'formInstructor'
                ).value.trim();


            const link =
                document.getElementById(
                    'formLink'
                ).value.trim();


            const color =
                document.getElementById(
                    'formColor'
                ).value;


            if (!subject) {

                alert(
                    'Please provide a subject name.'
                );

                return;
            }


            const targetKey =
                `${day}-${timeIndex}`;


            timetableData[targetKey] = {

                subject,

                room,

                instructor,

                link,

                color

            };


            persist();


            renderGridStructure();

            renderFormLists();


            /*
             * Clear form after saving.
             */

            document.getElementById(
                'formSubject'
            ).value = '';


            document.getElementById(
                'formRoom'
            ).value = '';


            document.getElementById(
                'formInstructor'
            ).value = '';


            document.getElementById(
                'formLink'
            ).value = '';
        }


        /* =========================
           WIPE ALL
           ========================= */

        function wipeAll() {

            const confirmed =
                confirm(
                    'Wipe the entire timetable?\n\n' +
                    'This will remove all timetable entries saved on this device.\n\n' +
                    'Your GitHub master timetable will NOT be changed.'
                );


            if (!confirmed) {
                return;
            }


            timetableData = {};


            persist();


            renderGridStructure();

            renderFormLists();


            alert(
                'Timetable has been wiped.'
            );
        }


        /* =========================
           REFRESH MASTER
           ========================= */

        async function refreshMaster() {

            const confirmed =
                confirm(
                    'Refresh from the master timetable?\n\n' +
                    'Your current local timetable will be replaced by the latest timetable.js from GitHub.'
                );


            if (!confirmed) {
                return;
            }


            try {

                /*
                 * The timestamp prevents the browser
                 * from using an old cached timetable.js.
                 */

                const response =
                    await fetch(
                        './timetable.js?refresh=' +
                        Date.now(),
                        {
                            cache: 'no-store'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        'Could not load timetable.js'
                    );
                }


                const jsText =
                    await response.text();


                /*
                 * Extract:
                 *
                 * const MASTER_TIMETABLE = {...};
                 */

                const match =
                    jsText.match(
                        /const\s+MASTER_TIMETABLE\s*=\s*(\{[\s\S]*\})\s*;?\s*$/
                    );


                if (!match) {

                    throw new Error(
                        'Invalid timetable.js format'
                    );
                }


                const latestMaster =
                    JSON.parse(
                        match[1]
                    );


                if (
                    !latestMaster ||
                    typeof latestMaster !== 'object' ||
                    Array.isArray(latestMaster)
                ) {

                    throw new Error(
                        'Invalid master timetable structure'
                    );
                }


                /*
                 * Replace local timetable.
                 */

                timetableData =
                    JSON.parse(
                        JSON.stringify(
                            latestMaster
                        )
                    );


                /*
                 * Also update the in-memory
                 * master copy.
                 */

                masterTimetableData =
                    JSON.parse(
                        JSON.stringify(
                            latestMaster
                        )
                    );


                /*
                 * Save the newly loaded master
                 * into this user's local storage.
                 */

                persist();


                renderGridStructure();

                renderFormLists();


                alert(
                    'Latest master timetable loaded successfully!'
                );


            } catch (error) {

                console.error(
                    'Master refresh error:',
                    error
                );


                alert(
                    'Could not load the master timetable from GitHub.\n\n' +
                    'Make sure timetable.js exists in the same folder as this HTML file and contains a valid MASTER_TIMETABLE.'
                );
            }
        }


        /* =========================
           EXPORT MASTER JS
           ========================= */

        function exportMasterJS() {

            /*
             * Convert the currently displayed timetable
             * into a JavaScript master file.
             */

            const jsContent =
`const MASTER_TIMETABLE = ${JSON.stringify(
    timetableData,
    null,
    4
)};
`;


            const blob =
                new Blob(
                    [jsContent],
                    {
                        type:
                            'application/javascript'
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const downloadAnchor =
                document.createElement(
                    'a'
                );


            downloadAnchor.href =
                url;


            downloadAnchor.download =
                'timetable.js';


            document.body.appendChild(
                downloadAnchor
            );


            downloadAnchor.click();


            downloadAnchor.remove();


            URL.revokeObjectURL(
                url
            );
        }


        /* =========================
           QUICK EDIT
           ========================= */

        function triggerQuickEdit(key) {

            activeEditKey = key;


            const data =
                timetableData[key] || {};


            document.getElementById(
                'modalSubject'
            ).value =
                data.subject || '';


            document.getElementById(
                'modalRoom'
            ).value =
                data.room || '';


            document.getElementById(
                'modalInstructor'
            ).value =
                data.instructor || '';


            document.getElementById(
                'modalLink'
            ).value =
                data.link || '';


            document.getElementById(
                'modalColor'
            ).value =
                data.color || 'blue';


            document.getElementById(
                'quickModal'
            ).style.display =
                'flex';
        }


        /* =========================
           CLOSE MODAL
           ========================= */

        function closeModal() {

            document.getElementById(
                'quickModal'
            ).style.display =
                'none';
        }


        /* =========================
           SAVE MODAL
           ========================= */

        function saveModalData() {

            const subject =
                document.getElementById(
                    'modalSubject'
                ).value.trim();


            const room =
                document.getElementById(
                    'modalRoom'
                ).value.trim();


            const instructor =
                document.getElementById(
                    'modalInstructor'
                ).value.trim();


            const link =
                document.getElementById(
                    'modalLink'
                ).value.trim();


            const color =
                document.getElementById(
                    'modalColor'
                ).value;


            if (!subject) {

                deleteModalData();

                return;
            }


            timetableData[
                activeEditKey
            ] = {

                subject,

                room,

                instructor,

                link,

                color

            };


            persist();


            closeModal();


            renderGridStructure();

            renderFormLists();
        }


        /* =========================
           DELETE / CLEAR MODAL
           ========================= */

        function deleteModalData() {

            if (!activeEditKey) {
                return;
            }


            delete timetableData[
                activeEditKey
            ];


            persist();


            closeModal();


            renderGridStructure();

            renderFormLists();
        }


        /* =========================
           DRAG START
           ========================= */

        function handleDragStart(e) {

            activeDraggedKey =
                this.getAttribute(
                    'data-key'
                );


            this.classList.add(
                'dragging'
            );


            e.dataTransfer.effectAllowed =
                'move';
        }


        /* =========================
           DRAG OVER
           ========================= */

        function handleDragOver(e) {

            e.preventDefault();


            this.classList.add(
                'drag-over'
            );


            e.dataTransfer.dropEffect =
                'move';
        }


        /* =========================
           DRAG LEAVE
           ========================= */

        function handleDragLeave() {

            this.classList.remove(
                'drag-over'
            );
        }


        /* =========================
           DROP
           ========================= */

        function handleDrop(e) {

            e.preventDefault();


            this.classList.remove(
                'drag-over'
            );


            const targetKey =
                this.getAttribute(
                    'data-key'
                );


            if (
                activeDraggedKey &&
                activeDraggedKey !== targetKey
            ) {

                const tempStorage =
                    timetableData[
                        targetKey
                    ];


                if (
                    timetableData[
                        activeDraggedKey
                    ]
                ) {

                    timetableData[
                        targetKey
                    ] =
                        timetableData[
                            activeDraggedKey
                        ];

                } else {

                    delete timetableData[
                        targetKey
                    ];
                }


                if (tempStorage) {

                    timetableData[
                        activeDraggedKey
                    ] =
                        tempStorage;

                } else {

                    delete timetableData[
                        activeDraggedKey
                    ];
                }


                persist();


                renderGridStructure();

                renderFormLists();
            }
        }


        /* =========================
           DRAG END
           ========================= */

        function handleDragEnd() {

            this.classList.remove(
                'dragging'
            );

            activeDraggedKey = null;
        }


        /* =========================
           CLOSE MODAL BY CLICKING
           OUTSIDE
           ========================= */

        window.onclick =
            function(e) {

                if (
                    e.target ===
                    document.getElementById(
                        'quickModal'
                    )
                ) {

                    closeModal();
                }
            };


        /* =========================
           START APPLICATION
           ========================= */

        init();

    </script>
