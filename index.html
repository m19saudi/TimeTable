<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TimeTable</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23000'%3E%3Cpath d='M11 6.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5z'/%3E%3Cpath d='M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z'/%3E%3C/svg%3E"
    >

    <!--
        IMPORTANT:
        This loads your master timetable.
        Keep timetable.js in the same GitHub folder
        as this index.html.
    -->

    <script src="timetable.js"></script>


    <style>

        :root {

            --bg-color: #090b11;
            --card-empty: #161923;

            --card-blue: #0091ff;
            --card-pink: #d02b9e;
            --card-green: #00bfa5;
            --card-orange: #f57c00;
            --card-purple: #8a2be2;
            --card-teal: #00afcb;
            --card-crimson: #e0115f;
            --card-gold: #d4af37;
            --card-lavender: #b19ffb;

            --text-main: #ffffff;
            --text-muted: #62697e;
        }


        * {
            box-sizing: border-box;
        }


        html {
            width: 100%;
            overflow-x: hidden;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                sans-serif;

            background-color: var(--bg-color);

            color: var(--text-main);

            margin: 0;

            padding: 20px 60px;

            display: flex;

            flex-direction: column;

            align-items: center;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =========================
           HEADER
           ========================= */

        .header-container {

            width: 100%;

            max-width: 1300px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .logo {

            font-size: 1.8rem;

            font-weight: 700;

            letter-spacing: -0.5px;

            white-space: nowrap;
        }


        .logo span {

            font-weight: 300;

            color: #a0a5b5;
        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .view-toggle-btn,
        .io-btn {

            border-radius: 20px;

            cursor: pointer;

            font-weight: 500;

            font-size: 0.82rem;

            transition: all 0.2s;

            white-space: nowrap;
        }


        .view-toggle-btn {

            background: none;

            border: 1px solid #232838;

            color: var(--text-muted);

            padding: 8px 14px;
        }


        .view-toggle-btn.active {

            background-color: #161923;

            color: var(--text-main);

            border-color: #3b4257;
        }


        .io-btn {

            background-color: #161923;

            border: 1px solid #3b4257;

            color: var(--text-main);

            padding: 8px 12px;

            display: flex;

            align-items: center;

            gap: 6px;
        }


        .io-btn:hover,
        .view-toggle-btn:hover {

            background-color: #232838;

            border-color: var(--card-blue);
        }


        .badge {

            background-color:
                rgba(0, 191, 165, 0.1);

            color: #00bfa5;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 0.82rem;

            font-weight: 500;

            display: flex;

            align-items: center;

            gap: 8px;

            border:
                1px solid rgba(0, 191, 165, 0.2);

            white-space: nowrap;
        }


        .badge::before {

            content: "●";

            font-size: 0.7rem;
        }


        /* =========================
           MAIN
           ========================= */

        .view-section {

            width: 100%;

            max-width: 1300px;
        }


        #entryView {
            display: none;
        }


        /* =========================
           GRID
           ========================= */

        .timetable-grid {

            display: grid;

            grid-template-columns:
                100px repeat(5, minmax(160px, 1fr));

            row-gap: 12px;

            column-gap: 24px;

            width: 100%;
        }


        .time-header {

            color: var(--text-muted);

            font-size: 0.9rem;

            font-weight: 500;

            text-align: center;

            padding-bottom: 5px;

            white-space: nowrap;
        }


        .day-header {

            color: #a0a5b5;

            font-weight: 600;

            font-size: 1.05rem;

            display: flex;

            align-items: center;

            justify-content: flex-start;

            height: 120px;
        }


        /* =========================
           CARDS
           ========================= */

        .slot-card {

            background-color: var(--card-empty);

            height: 120px;

            border-radius: 12px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 15px;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background-color 0.2s;

            user-select: none;

            position: relative;

            min-width: 0;

            overflow: hidden;
        }


        .slot-card:hover {

            transform: scale(1.02);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.3);
        }


        .slot-card.dragging {

            opacity: 0.3;

            border:
                2px dashed #ffffff;
        }


        .slot-card.drag-over {

            background-color: #202536;

            box-shadow:
                0 0 15px rgba(0,145,255,0.2);
        }


        .slot-card .dash {

            color: #383f52;

            font-size: 1.4rem;

            font-weight: 400;
        }


        .slot-card .subject {

            font-weight: 700;

            font-size: 1.05rem;

            margin-bottom: 5px;

            letter-spacing: -0.2px;

            max-width: 100%;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .slot-card .meta {

            font-size: 0.8rem;

            opacity: 0.8;

            margin-top: 2px;

            max-width: 100%;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        .slot-card .link-hint {

            position: absolute;

            bottom: 6px;

            right: 8px;

            font-size: 0.75rem;

            opacity: 0.6;
        }


        .slot-card:hover .link-hint {

            opacity: 1;

            transform: scale(1.1);
        }


        .slot-card.blue {
            background-color: var(--card-blue);
            color: white;
        }

        .slot-card.pink {
            background-color: var(--card-pink);
            color: white;
        }

        .slot-card.green {
            background-color: var(--card-green);
            color: white;
        }

        .slot-card.orange {
            background-color: var(--card-orange);
            color: white;
        }

        .slot-card.purple {
            background-color: var(--card-purple);
            color: white;
        }

        .slot-card.teal {
            background-color: var(--card-teal);
            color: white;
        }

        .slot-card.crimson {
            background-color: var(--card-crimson);
            color: white;
        }

        .slot-card.gold {
            background-color: var(--card-gold);
            color: #090b11;
        }

        .slot-card.lavender {
            background-color: var(--card-lavender);
            color: #090b11;
        }


        /* =========================
           ENTRY VIEW
           ========================= */

        .entry-container {

            display: grid;

            grid-template-columns: 1fr 2fr;

            gap: 40px;

            background-color: #11141d;

            padding: 40px;

            border-radius: 16px;

            border: 1px solid #1f2433;
        }


        .entry-form h3 {

            margin-top: 0;

            margin-bottom: 20px;

            font-size: 1.3rem;
        }


        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            font-size: 0.8rem;

            color: var(--text-muted);

            margin-bottom: 6px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 12px;

            background-color: var(--bg-color);

            border: 1px solid #232838;

            border-radius: 8px;

            color: white;

            font-size: 0.95rem;
        }


        .form-group input:focus,
        .form-group select:focus {

            outline: none;

            border-color: var(--card-blue);
        }


        .form-actions {

            display: flex;

            gap: 10px;

            margin-top: 25px;
        }


        .btn {

            padding: 12px 24px;

            border-radius: 8px;

            border: none;

            cursor: pointer;

            font-weight: 600;

            font-size: 0.95rem;

            transition: opacity 0.2s;
        }


        .btn:hover {
            opacity: 0.85;
        }


        .btn-primary {

            background-color: var(--card-blue);

            color: white;

            width: 100%;
        }


        .btn-secondary {

            background-color: #232838;

            color: white;
        }


        .btn-danger {

            background-color: #d32f2f;

            color: white;
        }


        .wipe-all-btn {

            margin-top: 10px;

            width: 100%;

            background-color: #4a1717;

            border: 1px solid #d32f2f;

            color: #ff8585;
        }


        .wipe-all-btn:hover {

            background-color: #d32f2f;

            color: white;
        }


        .entry-list-view {

            border-left: 1px solid #232838;

            padding-left: 40px;

            max-height: 500px;

            overflow-y: auto;
        }


        .list-item-row {

            background-color: var(--bg-color);

            padding: 15px 20px;

            border-radius: 10px;

            margin-bottom: 12px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-left: 4px solid var(--card-blue);

            gap: 15px;
        }


        .list-item-row.pink {
            border-left-color: var(--card-pink);
        }

        .list-item-row.green {
            border-left-color: var(--card-green);
        }

        .list-item-row.orange {
            border-left-color: var(--card-orange);
        }

        .list-item-row.purple {
            border-left-color: var(--card-purple);
        }

        .list-item-row.teal {
            border-left-color: var(--card-teal);
        }

        .list-item-row.crimson {
            border-left-color: var(--card-crimson);
        }

        .list-item-row.gold {
            border-left-color: var(--card-gold);
        }

        .list-item-row.lavender {
            border-left-color: var(--card-lavender);
        }


        .list-item-info {

            min-width: 0;
        }


        .list-item-info span {

            color: var(--text-muted);

            font-size: 0.85rem;

            margin-right: 10px;
        }


        /* =========================
           MODAL
           ========================= */

        .modal {

            display: none;

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background-color:
                rgba(0,0,0,0.7);

            backdrop-filter: blur(4px);

            justify-content: center;

            align-items: center;

            z-index: 100;

            padding: 20px;
        }


        .modal-content {

            background-color: #11141d;

            padding: 30px;

            border-radius: 16px;

            width: 340px;

            max-width: 100%;

            border: 1px solid #232838;

            box-shadow:
                0 20px 40px rgba(0,0,0,0.5);
        }


        /* =========================
           MASTER BUTTON
           ========================= */

        .master-btn {

            border-color: #00bfa5;

            color: #00bfa5;
        }


        .master-btn:hover {

            background-color:
                rgba(0,191,165,0.12);

            border-color: #00bfa5;
        }


        /* =========================
           TABLET LANDSCAPE
           ========================= */

        @media
        (min-width: 851px)
        and
        (max-width: 1100px) {

            body {
                padding: 16px 24px;
            }


            .header-container {

                max-width: 100%;

                margin-bottom: 16px;
            }


            .header-right {
                gap: 6px;
            }


            .io-btn,
            .view-toggle-btn {

                padding: 7px 9px;

                font-size: 0.72rem;
            }


            .badge {

                padding: 7px 10px;

                font-size: 0.72rem;
            }


            .timetable-grid {

                grid-template-columns:
                    55px repeat(5, minmax(0, 1fr));

                column-gap: 9px;

                row-gap: 9px;
            }


            .time-header {

                font-size: 0.72rem;
            }


            .day-header {

                height: 100px;

                font-size: 0.88rem;
            }


            .slot-card {

                height: 100px;

                padding: 8px;

                border-radius: 10px;
            }


            .slot-card .subject {
                font-size: 0.86rem;
            }


            .slot-card .meta {
                font-size: 0.68rem;
            }


            .slot-card .dash {
                font-size: 1.1rem;
            }


            .entry-container {

                gap: 25px;

                padding: 25px;
            }


            .entry-list-view {

                padding-left: 25px;
            }
        }


        /* =========================
           TABLET PORTRAIT
           ========================= */

        @media
        (min-width: 600px)
        and
        (max-width: 850px) {

            body {
                padding: 12px;
            }


            .header-container {

                width: 100%;

                margin-bottom: 14px;

                flex-wrap: wrap;

                gap: 10px;
            }


            .logo {
                font-size: 1.5rem;
            }


            .header-right {

                width: 100%;

                justify-content: flex-end;

                gap: 6px;
            }


            .io-btn,
            .view-toggle-btn {

                padding: 7px 8px;

                font-size: 0.68rem;
            }


            .timetable-grid {

                grid-template-columns:
                    48px repeat(5, minmax(0, 1fr));

                column-gap: 6px;

                row-gap: 8px;
            }


            .time-header {
                font-size: 0.62rem;
            }


            .day-header {

                height: 90px;

                font-size: 0.78rem;
            }


            .slot-card {

                height: 90px;

                padding: 6px;

                border-radius: 9px;
            }


            .slot-card .subject {
                font-size: 0.76rem;
            }


            .slot-card .meta {
                font-size: 0.62rem;
            }


            .slot-card .dash {
                font-size: 1rem;
            }


            .badge {
                display: none;
            }


            .entry-container {

                grid-template-columns: 1fr;

                gap: 25px;

                padding: 22px;
            }


            .entry-list-view {

                border-left: none;

                border-top:
                    1px solid #232838;

                padding-left: 0;

                padding-top: 25px;

                max-height: none;
            }
        }


        /* =========================
           VERY SMALL TABLETS
           ========================= */

        @media
        (min-width: 600px)
        and
        (max-width: 700px) {

            .logo {
                font-size: 1.35rem;
            }


            .header-right {
                justify-content: flex-start;
            }


            .timetable-grid {

                grid-template-columns:
                    42px repeat(5, minmax(0, 1fr));

                column-gap: 5px;

                row-gap: 7px;
            }


            .time-header {
                font-size: 0.55rem;
            }


            .day-header {

                height: 82px;

                font-size: 0.72rem;
            }


            .slot-card {

                height: 82px;

                padding: 4px;

                border-radius: 8px;
            }


            .slot-card .subject {
                font-size: 0.68rem;
            }


            .slot-card .meta {
                font-size: 0.56rem;
            }
        }


        /* =========================
           MOBILE
           ========================= */

        @media
        (max-width: 599px) {

            body {
                padding: 12px 8px;
            }


            .header-container {

                flex-direction: column;

                align-items: stretch;

                gap: 10px;

                margin-bottom: 12px;
            }


            .logo {

                text-align: center;

                font-size: 1.5rem;
            }


            .header-right {

                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 6px;
            }


            .io-btn,
            .view-toggle-btn {

                width: 100%;

                justify-content: center;

                padding: 8px 5px;

                font-size: 0.68rem;
            }


            .badge {
                display: none;
            }


            .timetable-grid {

                grid-template-columns:
                    36px repeat(5, minmax(0, 1fr));

                column-gap: 4px;

                row-gap: 6px;
            }


            .time-header {

                font-size: 0.46rem;

                white-space: normal;

                line-height: 1.1;
            }


            .day-header {

                height: 72px;

                font-size: 0.65rem;
            }


            .slot-card {

                height: 72px;

                padding: 3px;

                border-radius: 7px;
            }


            .slot-card .subject {

                font-size: 0.58rem;

                margin-bottom: 2px;
            }


            .slot-card .meta {
                font-size: 0.48rem;
            }


            .slot-card .dash {
                font-size: 0.85rem;
            }


            .slot-card .link-hint {
                display: none;
            }


            .entry-container {

                grid-template-columns: 1fr;

                gap: 20px;

                padding: 16px;
            }


            .entry-list-view {

                border-left: none;

                border-top:
                    1px solid #232838;

                padding-left: 0;

                padding-top: 20px;

                max-height: none;
            }


            .form-actions {
                flex-wrap: wrap;
            }


            .btn {
                padding: 10px 16px;
            }


            .modal-content {
                padding: 22px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
         ========================= -->

    <div class="header-container">


        <div class="logo">
            Time<span>Table</span>
        </div>


        <div class="header-right">


            <!--
                This button manually loads the current
                timetable.js master into localStorage.
            -->

            <button
                class="io-btn master-btn"
                onclick="refreshMasterSchedule()"
                title="Replace your local timetable with the current timetable.js"
            >
                🔄 Refresh Master
            </button>


            <button
                class="io-btn"
                onclick="exportData()"
            >
                📥 Export JSON
            </button>


            <button
                class="io-btn"
                onclick="document.getElementById('importFile').click()"
            >
                📤 Import JSON
            </button>


            <input
                type="file"
                id="importFile"
                style="display:none"
                accept=".json"
                onchange="importData(event)"
            >


            <button
                id="toggleGridBtn"
                class="view-toggle-btn active"
                onclick="switchView('grid')"
            >
                Grid View
            </button>


            <button
                id="toggleEntryBtn"
                class="view-toggle-btn"
                onclick="switchView('entry')"
            >
                Form Entry View
            </button>


            <div class="badge">
                Interactive Mode
            </div>

        </div>

    </div>


    <!-- =========================
         GRID VIEW
         ========================= -->

    <div
        id="gridView"
        class="view-section"
    >


        <div
            class="timetable-grid"
            id="mainTimetableGrid"
        >
        </div>


        <!--
            MASTER EXPORT IS INTENTIONALLY
            INSIDE GRID VIEW.

            This creates a timetable.js file from
            the timetable currently displayed.
        -->

        <div
            style="
                display:flex;
                justify-content:flex-end;
                margin-top:18px;
            "
        >

            <button
                class="io-btn master-btn"
                onclick="exportMasterJS()"
            >
                📦 Export Master JS
            </button>

        </div>


    </div>


    <!-- =========================
         FORM ENTRY VIEW
         ========================= -->

    <div
        id="entryView"
        class="view-section"
    >


        <div class="entry-container">


            <div class="entry-form">


                <h3>
                    Add / Manage Entry
                </h3>


                <div class="form-group">

                    <label for="formDay">
                        Day
                    </label>

                    <select id="formDay">

                        <option value="Sun">
                            Sunday
                        </option>

                        <option value="Mon">
                            Monday
                        </option>

                        <option value="Tue">
                            Tuesday
                        </option>

                        <option value="Wed">
                            Wednesday
                        </option>

                        <option value="Thu">
                            Thursday
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="formTime">
                        Time Slot
                    </label>

                    <select id="formTime">

                        <option value="0">
                            10:00 - 12:00
                        </option>

                        <option value="1">
                            12:00 - 14:00
                        </option>

                        <option value="2">
                            14:00 - 16:00
                        </option>

                        <option value="3">
                            16:00 - 18:00
                        </option>

                        <option value="4">
                            18:00 - 20:00
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="formSubject">
                        Subject Name
                    </label>

                    <input
                        type="text"
                        id="formSubject"
                        placeholder="e.g., Computer Science"
                    >

                </div>


                <div class="form-group">

                    <label for="formRoom">
                        Room / Modality
                    </label>

                    <input
                        type="text"
                        id="formRoom"
                        placeholder="e.g., Online, Room 153"
                    >

                </div>


                <div class="form-group">

                    <label for="formInstructor">
                        Instructor / Extra
                    </label>

                    <input
                        type="text"
                        id="formInstructor"
                        placeholder="e.g., Dr. Smith"
                    >

                </div>


                <div class="form-group">

                    <label for="formLink">
                        Class Join Link (URL)
                    </label>

                    <input
                        type="url"
                        id="formLink"
                        placeholder="https://zoom.us/..."
                    >

                </div>


                <div class="form-group">

                    <label for="formColor">
                        Color Accent
                    </label>

                    <select id="formColor">

                        <option value="blue">
                            Blue
                        </option>

                        <option value="pink">
                            Pink
                        </option>

                        <option value="green">
                            Green
                        </option>

                        <option value="orange">
                            Orange
                        </option>

                        <option value="purple">
                            Purple
                        </option>

                        <option value="teal">
                            Teal
                        </option>

                        <option value="crimson">
                            Crimson
                        </option>

                        <option value="gold">
                            Gold
                        </option>

                        <option value="lavender">
                            Lavender
                        </option>

                    </select>

                </div>


                <button
                    class="btn btn-primary"
                    onclick="handleFormSubmit()"
                >
                    Save to Timetable
                </button>


                <!-- Wipe All -->

                <button
                    class="btn wipe-all-btn"
                    onclick="wipeAll()"
                >
                    🗑 Wipe All
                </button>


            </div>


            <div class="entry-list-view">


                <h3
                    style="
                        margin-top:0;
                        color:var(--text-muted);
                        font-size:1.1rem;
                    "
                >
                    Current Active Classes
                </h3>


                <div id="liveStatusList"></div>


            </div>

        </div>

    </div>


    <!-- =========================
         QUICK EDIT MODAL
         ========================= -->

    <div
        id="quickModal"
        class="modal"
    >


        <div class="modal-content">


            <h3
                style="
                    margin-top:0;
                    margin-bottom:20px;
                "
            >
                Modify Class Block
            </h3>


            <div class="form-group">

                <label>
                    Subject
                </label>

                <input
                    type="text"
                    id="modalSubject"
                >

            </div>


            <div class="form-group">

                <label>
                    Room
                </label>

                <input
                    type="text"
                    id="modalRoom"
                >

            </div>


            <div class="form-group">

                <label>
                    Instructor
                </label>

                <input
                    type="text"
                    id="modalInstructor"
                >

            </div>


            <div class="form-group">

                <label>
                    Class Join Link (URL)
                </label>

                <input
                    type="url"
                    id="modalLink"
                >

            </div>


            <div class="form-group">

                <label>
                    Color
                </label>

                <select id="modalColor">

                    <option value="blue">
                        Blue
                    </option>

                    <option value="pink">
                        Pink
                    </option>

                    <option value="green">
                        Green
                    </option>

                    <option value="orange">
                        Orange
                    </option>

                    <option value="purple">
                        Purple
                    </option>

                    <option value="teal">
                        Teal
                    </option>

                    <option value="crimson">
                        Crimson
                    </option>

                    <option value="gold">
                        Gold
                    </option>

                    <option value="lavender">
                        Lavender
                    </option>

                </select>

            </div>


            <div class="form-actions">


                <button
                    class="btn btn-danger"
                    onclick="deleteModalData()"
                    style="margin-right:auto;"
                >
                    Clear
                </button>


                <button
                    class="btn btn-secondary"
                    onclick="closeModal()"
                >
                    Cancel
                </button>


                <button
                    class="btn btn-primary"
                    onclick="saveModalData()"
                    style="width:auto;"
                >
                    Save
                </button>


            </div>

        </div>

    </div>


    <!-- =========================
         APPLICATION JAVASCRIPT
         ========================= -->

    <script>


        const days = [
            'Sun',
            'Mon',
            'Tue',
            'Wed',
            'Thu'
        ];


        const times = [

            '10:00 - 12:00',

            '12:00 - 14:00',

            '14:00 - 16:00',

            '16:00 - 18:00',

            '18:00 - 20:00'

        ];


        const STORAGE_KEY =
            'perfect_timetable_db';


        /*
         * IMPORTANT:
         *
         * If localStorage already contains a timetable,
         * use the user's timetable.
         *
         * If there is no localStorage yet,
         * start from MASTER_TIMETABLE.
         */

        let timetableData;


        const savedData =
            localStorage.getItem(STORAGE_KEY);


        if (savedData) {

            try {

                timetableData =
                    JSON.parse(savedData);

            } catch (error) {

                timetableData =
                    cloneMasterTimetable();

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(timetableData)
                );
            }

        } else {

            timetableData =
                cloneMasterTimetable();

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(timetableData)
            );
        }


        let activeEditKey = null;

        let activeDraggedKey = null;


        /* =========================
           MASTER CLONE
           ========================= */

        function cloneMasterTimetable() {

            if (
                typeof MASTER_TIMETABLE === 'undefined'
            ) {

                console.error(
                    'MASTER_TIMETABLE was not found.'
                );

                return {};
            }


            return JSON.parse(
                JSON.stringify(
                    MASTER_TIMETABLE
                )
            );
        }


        /* =========================
           PERSIST
           ========================= */

        function persist() {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(timetableData)
            );
        }


        /* =========================
           REFRESH MASTER
           ========================= */

        function refreshMasterSchedule() {

            const confirmed =
                confirm(
                    'Refresh from the master timetable?\n\n' +
                    'This will replace your current local timetable ' +
                    'with the timetable stored in timetable.js.'
                );


            if (!confirmed) {
                return;
            }


            timetableData =
                cloneMasterTimetable();


            persist();


            renderGridStructure();

            renderFormLists();


            alert(
                'Master timetable loaded successfully.'
            );
        }


        /* =========================
           EXPORT JSON
           ========================= */

        function exportData() {

            const dataStr =
                'data:text/json;charset=utf-8,' +
                encodeURIComponent(
                    JSON.stringify(
                        timetableData,
                        null,
                        2
                    )
                );


            const downloadAnchor =
                document.createElement('a');


            downloadAnchor.setAttribute(
                'href',
                dataStr
            );


            downloadAnchor.setAttribute(
                'download',
                'timetable_backup.json'
            );


            document.body.appendChild(
                downloadAnchor
            );


            downloadAnchor.click();


            downloadAnchor.remove();
        }


        /* =========================
           EXPORT MASTER JS
           ========================= */

        function exportMasterJS() {

            const json =
                JSON.stringify(
                    timetableData,
                    null,
                    4
                );


            /*
             * This creates a real JavaScript file.
             *
             * You can upload the resulting file to GitHub
             * and replace the old timetable.js.
             */

            const jsContent =
`const MASTER_TIMETABLE = ${json};
`;


            const blob =
                new Blob(
                    [jsContent],
                    {
                        type:
                            'application/javascript'
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const downloadAnchor =
                document.createElement('a');


            downloadAnchor.href = url;


            downloadAnchor.download =
                'timetable.js';


            document.body.appendChild(
                downloadAnchor
            );


            downloadAnchor.click();


            downloadAnchor.remove();


            URL.revokeObjectURL(url);


            alert(
                'Master timetable.js exported successfully.\n\n' +
                'You can now replace the timetable.js file ' +
                'in your GitHub repository with this file.'
            );
        }


        /* =========================
           IMPORT JSON
           ========================= */

        function importData(event) {

            const file =
                event.target.files[0];


            if (!file) {
                return;
            }


            const fileReader =
                new FileReader();


            fileReader.onload =
                function(e) {

                    try {

                        const parsedData =
                            JSON.parse(
                                e.target.result
                            );


                        if (
                            parsedData &&
                            typeof parsedData ===
                                'object' &&
                            !Array.isArray(parsedData)
                        ) {

                            timetableData =
                                parsedData;


                            persist();


                            renderGridStructure();

                            renderFormLists();


                            alert(
                                'Timetable successfully imported!'
                            );

                        } else {

                            alert(
                                'Invalid timetable file structure.'
                            );
                        }


                    } catch (error) {

                        alert(
                            'Error loading file. ' +
                            'Please upload a valid JSON file.'
                        );
                    }

                };


            fileReader.readAsText(file);


            /*
             * Allows the same file to be selected
             * again later.
             */

            event.target.value = '';
        }


        /* =========================
           WIPE ALL
           ========================= */

        function wipeAll() {

            const confirmed =
                confirm(
                    'Wipe the entire timetable?\n\n' +
                    'This will remove every class from your local timetable.'
                );


            if (!confirmed) {
                return;
            }


            const doubleConfirmed =
                confirm(
                    'Are you sure?\n\n' +
                    'All local timetable entries will be deleted.'
                );


            if (!doubleConfirmed) {
                return;
            }


            timetableData = {};


            persist();


            renderGridStructure();

            renderFormLists();


            alert(
                'All timetable entries have been wiped.'
            );
        }


        /* =========================
           VIEW SWITCH
           ========================= */

        function switchView(viewName) {

            if (viewName === 'grid') {

                document.getElementById(
                    'gridView'
                ).style.display = 'block';


                document.getElementById(
                    'entryView'
                ).style.display = 'none';


                document.getElementById(
                    'toggleGridBtn'
                ).classList.add('active');


                document.getElementById(
                    'toggleEntryBtn'
                ).classList.remove('active');


                renderGridStructure();


            } else {

                document.getElementById(
                    'gridView'
                ).style.display = 'none';


                document.getElementById(
                    'entryView'
                ).style.display = 'block';


                document.getElementById(
                    'toggleGridBtn'
                ).classList.remove('active');


                document.getElementById(
                    'toggleEntryBtn'
                ).classList.add('active');


                renderFormLists();
            }
        }


        /* =========================
           GRID RENDER
           ========================= */

        function renderGridStructure() {

            const grid =
                document.getElementById(
                    'mainTimetableGrid'
                );


            grid.innerHTML = '';


            /*
             * Header spacer
             */

            const spacer =
                document.createElement('div');


            spacer.className =
                'time-header-spacer';


            grid.appendChild(spacer);


            /*
             * Time headers
             */

            times.forEach(
                function(time) {

                    const header =
                        document.createElement(
                            'div'
                        );


                    header.className =
                        'time-header';


                    header.textContent =
                        time;


                    grid.appendChild(header);

                }
            );


            /*
             * Days
             */

            days.forEach(
                function(day) {

                    const dayLabel =
                        document.createElement(
                            'div'
                        );


                    dayLabel.className =
                        'day-header';


                    dayLabel.textContent =
                        day;


                    grid.appendChild(
                        dayLabel
                    );


                    /*
                     * Five time slots
                     */

                    for (
                        let i = 0;
                        i < 5;
                        i++
                    ) {

                        const slotKey =
                            `${day}-${i}`;


                        const card =
                            document.createElement(
                                'div'
                            );


                        card.className =
                            'slot-card';


                        card.setAttribute(
                            'data-key',
                            slotKey
                        );


                        if (
                            timetableData[
                                slotKey
                            ]
                        ) {

                            const data =
                                timetableData[
                                    slotKey
                                ];


                            card.classList.add(
                                data.color ||
                                'blue'
                            );


                            card.draggable =
                                true;


                            const hasLink =
                                data.link &&
                                data.link.trim() !== '';


                            const linkIcon =
                                hasLink
                                    ? ' 🔗'
                                    : '';


                            /*
                             * textContent is used rather than
                             * blindly inserting user data as HTML.
                             */

                            const subject =
                                document.createElement(
                                    'div'
                                );


                            subject.className =
                                'subject';


                            subject.textContent =
                                data.subject || '';


                            const room =
                                document.createElement(
                                    'div'
                                );


                            room.className =
                                'meta';


                            room.textContent =
                                (data.room || '') +
                                linkIcon;


                            const instructor =
                                document.createElement(
                                    'div'
                                );


                            instructor.className =
                                'meta';


                            instructor.textContent =
                                data.instructor ||
                                '';


                            card.appendChild(
                                subject
                            );


                            card.appendChild(
                                room
                            );


                            card.appendChild(
                                instructor
                            );


                            /*
                             * Link hint
                             */

                            if (hasLink) {

                                const hint =
                                    document.createElement(
                                        'div'
                                    );


                                hint.className =
                                    'link-hint';


                                hint.textContent =
                                    '↗';


                                card.appendChild(
                                    hint
                                );
                            }


                            /*
                             * Clicking a linked class
                             * opens the link.
                             *
                             * Right-click opens editing.
                             */

                            card.addEventListener(
                                'click',
                                function() {

                                    if (hasLink) {

                                        window.open(
                                            data.link.trim(),
                                            '_blank'
                                        );

                                    } else {

                                        triggerQuickEdit(
                                            slotKey
                                        );
                                    }
                                }
                            );


                            card.addEventListener(
                                'contextmenu',
                                function(e) {

                                    e.preventDefault();

                                    triggerQuickEdit(
                                        slotKey
                                    );
                                }
                            );


                        } else {

                            card.innerHTML =
                                '<div class="dash">-</div>';


                            card.addEventListener(
                                'click',
                                function() {

                                    triggerQuickEdit(
                                        slotKey
                                    );
                                }
                            );
                        }


                        /*
                         * Drag and drop
                         */

                        card.addEventListener(
                            'dragstart',
                            handleDragStart
                        );


                        card.addEventListener(
                            'dragover',
                            handleDragOver
                        );


                        card.addEventListener(
                            'dragleave',
                            handleDragLeave
                        );


                        card.addEventListener(
                            'drop',
                            handleDrop
                        );


                        card.addEventListener(
                            'dragend',
                            handleDragEnd
                        );


                        grid.appendChild(
                            card
                        );
                    }

                }
            );
        }


        /* =========================
           FORM LIST
           ========================= */

        function renderFormLists() {

            const listContainer =
                document.getElementById(
                    'liveStatusList'
                );


            listContainer.innerHTML = '';


            let count = 0;


            days.forEach(
                function(day) {

                    for (
                        let i = 0;
                        i < 5;
                        i++
                    ) {

                        const key =
                            `${day}-${i}`;


                        if (
                            timetableData[key]
                        ) {

                            count++;


                            const data =
                                timetableData[key];


                            const item =
                                document.createElement(
                                    'div'
                                );


                            item.className =
                                `list-item-row ${
                                    data.color || 'blue'
                                }`;


                            const info =
                                document.createElement(
                                    'div'
                                );


                            info.className =
                                'list-item-info';


                            const time =
                                document.createElement(
                                    'span'
                                );


                            time.textContent =
                                `[${day} ${times[i]}]`;


                            const subject =
                                document.createElement(
                                    'strong'
                                );


                            subject.textContent =
                                data.subject || '';


                            const details =
                                document.createElement(
                                    'div'
                                );


                            details.style.cssText =
                                `
                                font-size:0.8rem;
                                opacity:0.7;
                                margin-top:2px;
                                `;


                            details.textContent =
                                `${data.room || ''}${
                                    data.instructor
                                        ? ' • ' +
                                          data.instructor
                                        : ''
                                }`;


                            info.appendChild(
                                time
                            );


                            info.appendChild(
                                subject
                            );


                            info.appendChild(
                                details
                            );


                            if (data.link) {

                                const link =
                                    document.createElement(
                                        'div'
                                    );


                                link.style.cssText =
                                    `
                                    font-size:0.75rem;
                                    color:#0091ff;
                                    overflow:hidden;
                                    text-overflow:ellipsis;
                                    white-space:nowrap;
                                    max-width:300px;
                                    margin-top:4px;
                                    `;


                                link.textContent =
                                    `🔗 ${data.link}`;


                                info.appendChild(
                                    link
                                );
                            }


                            const editButton =
                                document.createElement(
                                    'button'
                                );


                            editButton.className =
                                'view-toggle-btn active';


                            editButton.textContent =
                                'Edit';


                            editButton.onclick =
                                function() {

                                    triggerQuickEdit(
                                        key
                                    );
                                };


                            item.appendChild(
                                info
                            );


                            item.appendChild(
                                editButton
                            );


                            listContainer.appendChild(
                                item
                            );
                        }
                    }
                }
            );


            if (count === 0) {

                listContainer.innerHTML = `

                    <div
                        style="
                            color:var(--text-muted);
                            font-size:0.9rem;
                        "
                    >
                        No entries saved yet.
                        Fill out the form fields on the left
                        to add your items.
                    </div>

                `;
            }
        }


        /* =========================
           FORM SUBMIT
           ========================= */

        function handleFormSubmit() {

            const day =
                document.getElementById(
                    'formDay'
                ).value;


            const timeIndex =
                document.getElementById(
                    'formTime'
                ).value;


            const subject =
                document.getElementById(
                    'formSubject'
                ).value.trim();


            const room =
                document.getElementById(
                    'formRoom'
                ).value.trim();


            const instructor =
                document.getElementById(
                    'formInstructor'
                ).value.trim();


            const link =
                document.getElementById(
                    'formLink'
                ).value.trim();


            const color =
                document.getElementById(
                    'formColor'
                ).value;


            if (!subject) {

                alert(
                    'Please provide a subject name.'
                );

                return;
            }


            const targetKey =
                `${day}-${timeIndex}`;


            timetableData[targetKey] = {

                subject,

                room,

                instructor,

                link,

                color

            };


            persist();


            renderGridStructure();

            renderFormLists();


            document.getElementById(
                'formSubject'
            ).value = '';


            document.getElementById(
                'formRoom'
            ).value = '';


            document.getElementById(
                'formInstructor'
            ).value = '';


            document.getElementById(
                'formLink'
            ).value = '';
        }


        /* =========================
           QUICK EDIT
           ========================= */

        function triggerQuickEdit(key) {

            activeEditKey =
                key;


            const data =
                timetableData[key] ||
                {};


            document.getElementById(
                'modalSubject'
            ).value =
                data.subject || '';


            document.getElementById(
                'modalRoom'
            ).value =
                data.room || '';


            document.getElementById(
                'modalInstructor'
            ).value =
                data.instructor || '';


            document.getElementById(
                'modalLink'
            ).value =
                data.link || '';


            document.getElementById(
                'modalColor'
            ).value =
                data.color || 'blue';


            document.getElementById(
                'quickModal'
            ).style.display =
                'flex';
        }


        function closeModal() {

            document.getElementById(
                'quickModal'
            ).style.display =
                'none';
        }


        function saveModalData() {

            const subject =
                document.getElementById(
                    'modalSubject'
                ).value.trim();


            const room =
                document.getElementById(
                    'modalRoom'
                ).value.trim();


            const instructor =
                document.getElementById(
                    'modalInstructor'
                ).value.trim();


            const link =
                document.getElementById(
                    'modalLink'
                ).value.trim();


            const color =
                document.getElementById(
                    'modalColor'
                ).value;


            if (!subject) {

                deleteModalData();

                return;
            }


            timetableData[activeEditKey] = {

                subject,

                room,

                instructor,

                link,

                color

            };


            persist();


            closeModal();


            renderGridStructure();

            renderFormLists();
        }


        function deleteModalData() {

            if (!activeEditKey) {
                return;
            }


            delete timetableData[
                activeEditKey
            ];


            persist();


            closeModal();


            renderGridStructure();

            renderFormLists();
        }


        /* =========================
           DRAG & DROP
           ========================= */

        function handleDragStart(e) {

            activeDraggedKey =
                this.getAttribute(
                    'data-key'
                );


            this.classList.add(
                'dragging'
            );
        }


        function handleDragOver(e) {

            e.preventDefault();


            this.classList.add(
                'drag-over'
            );
        }


        function handleDragLeave() {

            this.classList.remove(
                'drag-over'
            );
        }


        function handleDrop(e) {

            e.preventDefault();


            this.classList.remove(
                'drag-over'
            );


            const targetKey =
                this.getAttribute(
                    'data-key'
                );


            if (
                activeDraggedKey &&
                activeDraggedKey !== targetKey
            ) {

                const tempStorage =
                    timetableData[targetKey];


                if (
                    timetableData[
                        activeDraggedKey
                    ]
                ) {

                    timetableData[targetKey] =
                        timetableData[
                            activeDraggedKey
                        ];

                } else {

                    delete timetableData[
                        targetKey
                    ];
                }


                if (tempStorage) {

                    timetableData[
                        activeDraggedKey
                    ] =
                        tempStorage;

                } else {

                    delete timetableData[
                        activeDraggedKey
                    ];
                }


                persist();


                renderGridStructure();

                renderFormLists();
            }
        }


        function handleDragEnd() {

            this.classList.remove(
                'dragging'
            );


            activeDraggedKey =
                null;
        }


        /* =========================
           CLOSE MODAL
           ========================= */

        window.onclick =
            function(e) {

                if (
                    e.target ===
                    document.getElementById(
                        'quickModal'
                    )
                ) {

                    closeModal();
                }
            };


        /* =========================
           START
           ========================= */

        function init() {

            renderGridStructure();

            renderFormLists();
        }


        init();

    </script>

</body>
